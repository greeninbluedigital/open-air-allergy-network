name: Process pending leads

# Backup for the lead auto-forward. Since 2026-11-23 each lead gets its own
# Upstash QStash call an hour after it's submitted (/api/leads/forward-due).
# This poll catches anything that missed. It's scheduled hourly, but GitHub
# runs low-priority schedules only about 3 times a day. Each run wakes the
# Neon database for ~5 minutes, so don't make it more frequent
# (docs/lead-forms.md).
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch: {}

jobs:
  process-pending:
    runs-on: ubuntu-latest
    steps:
      - name: Hit /api/leads/process-pending
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ vars.SITE_URL }}/api/leads/process-pending"
