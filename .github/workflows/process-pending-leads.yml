name: Process pending leads

# Auto-forwards contact-form leads that haven't confirmed their email within
# ~60 minutes (Section 4's Stage 2 fallback). Vercel Hobby cron can't run
# more often than once a day, so this polls the same endpoint externally
# instead of relying on vercel.json for it. Hourly since 2026-10-26: every
# run wakes the Neon database for ~5 minutes, and the 15-minute interval was
# using most of the free compute allowance. An unconfirmed lead now forwards
# within 1 to 2 hours (confirmed leads still forward on the click). Switch
# back to "*/15 * * * *" once lead volume justifies it (docs/punch-list.md).
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch: {}

jobs:
  process-pending:
    runs-on: ubuntu-latest
    steps:
      - name: Hit /api/leads/process-pending
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ vars.SITE_URL }}/api/leads/process-pending"
